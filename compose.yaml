services:
  mongodb:
    image: mongo:7.0
    container_name: chello-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chello-api:
    build:
      context: ../chello-api
    container_name: chello-api
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BUILD_MODE: dev
      LOCAL_DEV_APP_HOST: 0.0.0.0
      LOCAL_DEV_APP_PORT: 8017
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      DATABASE_NAME: ${DATABASE_NAME:-chello-db}
      WEBSITE_DOMAIN_DEVELOPMENT: ${WEBSITE_DOMAIN_DEVELOPMENT:-http://localhost:5173}
      WEBSITE_DOMAIN_PRODUCTION: ${WEBSITE_DOMAIN_PRODUCTION:-http://localhost:5173}
      ACCESS_TOKEN_SECRET_SIGNATURE: ${ACCESS_TOKEN_SECRET_SIGNATURE:-chello-local-access-token-secret-key-2026}
      ACCESS_TOKEN_LIFE: ${ACCESS_TOKEN_LIFE:-1h}
      REFRESH_TOKEN_SECRET_SIGNATURE: ${REFRESH_TOKEN_SECRET_SIGNATURE:-chello-local-refresh-token-secret-key-2026}
      REFRESH_TOKEN_LIFE: ${REFRESH_TOKEN_LIFE:-14 days}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      ADMIN_EMAIL_ADDRESS: ${ADMIN_EMAIL_ADDRESS:-}
      ADMIN_EMAIL_NAME: ${ADMIN_EMAIL_NAME:-Chello Admin}
    ports:
      - "8017:8017"
    restart: unless-stopped

  chello-web:
    build:
      context: .
      args:
        VITE_API_ROOT: http://localhost:8017
    container_name: chello-web
    depends_on:
      - chello-api
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  mongodb_data:
